name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out handbook
        # actions/checkout v6.0.2, verified 2026-09-06
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: handbook
          persist-credentials: false
      - name: Set up Node
        # actions/setup-node v7.0.0, verified 2026-09-06
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
      - name: Check out pinned upstream
        # actions/checkout v6.0.2, verified 2026-09-06
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 76fda729799fe9b3848dbe2c211d4b231032b81e
          path: upstream
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Test
        run: npm test
        working-directory: handbook
      - name: Verify evidence
        run: npm run verify -- --root "$GITHUB_WORKSPACE/handbook" --source "$GITHUB_WORKSPACE/upstream"
        working-directory: handbook
