<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness：应用装配与运行协作</title>
  <desc id="desc">CLI 的 dsh 选择 Application Profile，按顺序组合 Bundle 与 Patch，由 Cordis 装载插件树。Desktop 由 Electron 启动独立 Node Host，用管道和 dsh-app 协议传输，应用传输不开 Web 端口。模型经模型适配器与 Agent loop 双向交互，loop 调用工具服务、记录 Session Event Log，工具连接外部世界。Application Profile 与 Agent Preset 分别负责应用级和每个 Agent 的能力组合；分组不代表安全隔离。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526781"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #13243b; }
      .label { font-size: 18px; font-weight: 600; fill: #13243b; }
      .body { font-size: 16px; fill: #475569; }
      .small { font-size: 14px; fill: #64748b; }
      .line { fill: none; stroke: #526781; stroke-width: 2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="710" rx="20" fill="#f8fafc"/>
  <text x="36" y="40" font-size="13" font-weight="700" letter-spacing="2" fill="#2563eb">01 / ARCHITECTURE</text>
  <text x="36" y="77" class="title">从应用装配到运行协作</text>

  <rect x="36" y="106" width="248" height="80" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="138" text-anchor="middle" class="label">dsh · Application Profile</text>
  <text x="160" y="164" text-anchor="middle" class="body">选择应用启动组合</text>
  <path d="M 286 146 H 352" class="line"/>
  <rect x="360" y="106" width="246" height="80" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="483" y="138" text-anchor="middle" class="label">Bundle + Patch</text>
  <text x="483" y="164" text-anchor="middle" class="body">依次组合插件配置</text>
  <path d="M 608 146 H 674" class="line"/>
  <rect x="682" y="106" width="282" height="80" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="823" y="138" text-anchor="middle" class="label">Cordis / Loader</text>
  <text x="823" y="164" text-anchor="middle" class="body">装载插件树与依赖</text>
  <path d="M 823 188 V 308 H 660 V 330" class="line"/>

  <rect x="36" y="208" width="572" height="82" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="58" y="238" class="label">Desktop · Electron → 独立 Node Host</text>
  <text x="58" y="264" class="body">管道 / dsh-app:// · 应用传输不开 Web 端口</text>
  <path d="M 324 292 V 316 H 340 V 330" class="line"/>

  <g transform="translate(0,90)">

  <rect x="212" y="248" width="576" height="292" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="234" y="278" class="label">Harness 插件树</text>
  <text x="764" y="278" text-anchor="end" class="small">组合关系 · 非安全边界</text>

  <rect x="36" y="326" width="144" height="78" rx="12" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="108" y="357" text-anchor="middle" class="label">Model</text>
  <text x="108" y="383" text-anchor="middle" class="body">生成响应与调用</text>

  <rect x="238" y="326" width="150" height="78" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="313" y="357" text-anchor="middle" class="label">模型适配器</text>
  <text x="313" y="383" text-anchor="middle" class="body">请求与响应接入</text>
  <path d="M 182 366 H 235" class="line both"/>

  <rect x="422" y="326" width="150" height="78" rx="12" fill="#2563eb"/>
  <text x="497" y="357" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Agent loop</text>
  <text x="497" y="383" text-anchor="middle" font-size="16" fill="#dbeafe">推进 Turn / Step</text>
  <path d="M 391 366 H 419" class="line both"/>

  <rect x="606" y="326" width="156" height="78" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="684" y="357" text-anchor="middle" class="label">工具与服务</text>
  <text x="684" y="383" text-anchor="middle" class="body">策略与执行管线</text>
  <path d="M 575 366 H 603" class="line both"/>

  <rect x="826" y="326" width="138" height="78" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="895" y="357" text-anchor="middle" class="label">外部世界</text>
  <text x="895" y="383" text-anchor="middle" class="body">文件 / 进程 / Web</text>
  <path d="M 765 366 H 823" class="line both"/>

  <path d="M 497 407 V 443" class="line"/>
  <rect x="380" y="450" width="270" height="66" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="515" y="477" text-anchor="middle" class="label">Session Event Log</text>
  <text x="515" y="501" text-anchor="middle" class="body">追加事实 → 投影模型历史</text>

  <text x="36" y="574" class="body">Application Profile：应用级组合</text>
  <text x="964" y="574" text-anchor="end" class="body">Agent Preset：每个 Agent 的 prompt / tools / services</text>
  <text x="36" y="603" class="small">基线 0d1f5000 · 模型适配器、循环、工具和会话能力均由插件提供</text>
  </g>
</svg>
